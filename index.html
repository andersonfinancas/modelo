<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>FinConsult</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#fff;color:#1a1a2e;max-width:500px;margin:0 auto;padding-bottom:30px;font-size:14px}
        .header{background:#1a1a2e;color:#fff;padding:12px;text-align:center;position:sticky;top:0;z-index:100}
        .header h1{font-size:16px;margin-bottom:4px}
        .month-nav{display:flex;align-items:center;justify-content:center;gap:12px}
        .month-nav button{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;padding:4px 8px}
        .month-nav span{font-size:15px;font-weight:600;min-width:140px}
        .year-tabs{display:flex;justify-content:center;gap:6px;margin-top:6px;flex-wrap:wrap;align-items:center}
        .year-tabs button{background:rgba(255,255,255,.2);border:none;color:#fff;font-size:11px;cursor:pointer;padding:3px 10px;border-radius:10px}
        .year-tabs button.active{background:rgba(255,255,255,.5);font-weight:700}
        .year-tabs .yr-add,.year-tabs .yr-del{font-size:14px;padding:2px 8px}
        .chart-section{padding:10px 12px;background:#f8f9fa;border-bottom:1px solid #eee}
        .chart-title{font-size:13px;font-weight:700;margin-bottom:8px;text-align:center}
        .chart-row{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:12px}
        .chart-label{width:30px;text-align:center;font-weight:600;flex-shrink:0}
        .chart-bar-container{flex:1;height:18px;background:#eee;border-radius:4px;overflow:hidden;position:relative}
        .chart-bar{height:100%;border-radius:4px;min-width:2px;transition:width .3s}
        .chart-bar.positive{background:#27ae60}
        .chart-bar.negative{background:#e74c3c}
        .chart-bar.current{opacity:.7;background:repeating-linear-gradient(45deg,#27ae60,#27ae60 5px,#2ecc71 5px,#2ecc71 10px)}
        .chart-bar.current.negative{background:repeating-linear-gradient(45deg,#e74c3c,#e74c3c 5px,#e57373 5px,#e57373 10px)}
        .chart-bar.future{opacity:.4}
        .chart-value{width:75px;text-align:right;font-weight:600;flex-shrink:0;font-size:11px}
        .chart-value.positive{color:#27ae60}
        .chart-value.negative{color:#e74c3c}
        .chart-event{font-size:9px;margin-left:4px;flex-shrink:0}
        .chart-summary{display:flex;justify-content:center;gap:15px;margin-top:8px;font-size:11px;font-weight:600}
        .summary{padding:12px}
        .summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
        .summary-item{padding:8px;border-radius:8px;background:#f8f9fa}
        .summary-item .label{font-size:10px;color:#666;text-transform:uppercase}
        .summary-item .value{font-size:16px;font-weight:700}
        .summary-item .value.green{color:#27ae60}
        .summary-item .value.red{color:#e74c3c}
        .summary-remaining{grid-column:1/-1;text-align:center;padding:12px;border-radius:8px;margin-top:4px}
        .summary-remaining .label{font-size:11px}
        .summary-remaining .value{font-size:22px;font-weight:800}
        .bg-green{background:#e8f5e9}
        .bg-yellow{background:#fff8e1}
        .bg-red{background:#fce4ec}
        .alert-bar{text-align:center;padding:4px;font-size:10px;font-weight:600;border-radius:4px;margin-top:6px}
        .action-buttons{display:flex;gap:8px;padding:8px 12px}
        .action-btn{flex:1;padding:10px;border:2px dashed #ddd;border-radius:8px;background:none;font-size:13px;cursor:pointer;color:#666;text-align:center}
        .action-btn:active{background:#f0f0f0}
        .section{padding:8px 12px}
        .section-title{font-size:13px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:6px}
        .section-title.clickable{cursor:pointer}
        .item{display:flex;align-items:center;padding:10px;border-radius:8px;background:#f8f9fa;margin-bottom:5px}
        .item.paid{opacity:.45}
        .item-check{width:22px;height:22px;border:2px solid #ccc;border-radius:50%;margin-right:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px}
        .item-check.checked{background:#27ae60;border-color:#27ae60;color:#fff}
        .item-info{flex:1;min-width:0}
        .item-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .item-detail{font-size:11px;color:#888}
        .item-value{font-size:14px;font-weight:700;margin-left:6px;white-space:nowrap}
        .item-value.income{color:#27ae60}
        .item-value.expense{color:#e74c3c}
        .item-actions{display:flex;gap:2px;margin-left:4px}
        .item-actions button{background:none;border:none;font-size:14px;cursor:pointer;padding:3px}
        .separator{text-align:center;font-size:11px;color:#999;margin:10px 0 6px;padding:4px;border-top:1px solid #eee}
        .bottom-buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:8px 12px}
        .bottom-btn{padding:8px 14px;border:1px solid #ddd;border-radius:8px;background:#f8f9fa;font-size:12px;cursor:pointer;color:#555}
        .bottom-btn:active{background:#eee}
        .cat-section{padding:8px 12px}
        .cat-row{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-radius:6px;margin-bottom:3px;font-size:12px;background:#f8f9fa}
        .cat-bar-bg{flex:1;height:8px;background:#eee;border-radius:4px;margin:0 8px;max-width:80px}
        .cat-bar-fill{height:100%;border-radius:4px}
        .modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:200;justify-content:center;align-items:center}
        .modal-overlay.active{display:flex}
        .modal{background:#fff;border-radius:12px;padding:16px;width:90%;max-width:380px;max-height:85vh;overflow-y:auto}
        .modal h3{margin-bottom:12px;font-size:16px}
        .modal label{display:block;margin-bottom:3px;font-size:12px;color:#666;font-weight:600}
        .modal input,.modal select{width:100%;padding:8px;border:1px solid #ddd;border-radius:8px;font-size:14px;margin-bottom:8px;-webkit-appearance:none}
        .modal-buttons{display:flex;gap:8px;margin-top:8px}
        .modal-buttons button{flex:1;padding:10px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
        .btn-save{background:#1a1a2e;color:#fff}
        .btn-cancel{background:#f0f0f0;color:#333}
        .btn-delete{background:#e74c3c;color:#fff}
        .toggle-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
        .toggle{width:44px;height:24px;background:#ddd;border-radius:12px;position:relative;cursor:pointer;transition:background .3s;flex-shrink:0}
        .toggle.active{background:#27ae60}
        .toggle::after{content:'';position:absolute;width:20px;height:20px;background:#fff;border-radius:50%;top:2px;left:2px;transition:left .3s}
        .toggle.active::after{left:22px}
        .welcome-card{margin:12px;padding:16px;background:#e8f5e9;border-radius:12px;border:1px solid #c8e6c9}
        .welcome-card h3{font-size:15px;margin-bottom:8px}
        .welcome-card p{font-size:12px;margin-bottom:6px;line-height:1.4}
        .welcome-card button{background:#1a1a2e;color:#fff;border:none;padding:8px 20px;border-radius:8px;font-size:13px;cursor:pointer;margin-top:6px}
        .suggest-section{padding:8px 12px;display:none}
        .suggest-row{display:flex;justify-content:space-between;padding:5px 8px;font-size:12px;border-radius:6px;margin-bottom:2px;background:#f8f9fa}
        .saldo-section{padding:8px 12px;background:#f0f8ff;border-radius:8px;margin:8px 12px}
        .saldo-row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}
    </style>
</head>
<body>

<div class="header">
    <h1>💰 FinConsult</h1>
    <div class="month-nav">
        <button onclick="changeMonth(-1)">‹</button>
        <span id="monthLabel">Outubro 2026</span>
        <button onclick="changeMonth(1)">›</button>
    </div>
    <div class="year-tabs" id="yearTabs"></div>
</div>

<div class="chart-section">
    <div class="chart-title">📈 Projeção do Ano</div>
    <div id="chartArea"></div>
    <div class="chart-summary" id="chartSummary"></div>
</div>

<div class="summary" id="summaryArea"></div>

<div class="action-buttons">
    <button class="action-btn" onclick="openModal('revenue')">+ Receita</button>
    <button class="action-btn" onclick="openModal('expense')">+ Conta</button>
</div>

<div class="cat-section" id="catSection">
    <div class="section-title clickable" onclick="toggleCat()">📊 Por Categoria ▼</div>
    <div id="catContent" style="display:none"></div>
</div>

<div class="section" id="revenueSection"></div>
<div class="section" id="pendingSection"></div>
<div id="paidSeparator"></div>
<div class="section" id="paidSection"></div>

<div class="bottom-buttons">
    <button class="bottom-btn" onclick="openSuggestion()">💡 Sugestão</button>
    <button class="bottom-btn" onclick="openSaldo()">⚙️ Saldo Inicial</button>
    <button class="bottom-btn" onclick="removeMonth()">🗑️ Remover Mês</button>
</div>

<div class="bottom-buttons">
    <button class="bottom-btn" onclick="generatePDF('month')">📄 PDF do Mês</button>
    <button class="bottom-btn" onclick="generatePDF('year')">📄 PDF do Ano</button>
</div>

<div id="welcomeArea"></div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modalContent"></div>
</div>

<div class="suggest-section" id="suggestSection">
    <div class="section-title">💡 Distribuição Sugerida (50/30/20)</div>
    <div id="suggestContent"></div>
    <div style="text-align:center;margin-top:8px">
        <button class="bottom-btn" onclick="closeSuggestion()">Fechar</button>
    </div>
</div>

<script>
const MONTHS=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const CATEGORIES=['🏠 Moradia','🍔 Alimentação','🚗 Transporte','🎓 Educação','💊 Saúde','💳 Dívidas','🎮 Lazer','👔 Pessoal','📈 Investimento','🛡️ Reserva','📦 Outros'];
const SUGGEST_PCT={'🏠 Moradia':30,'🍔 Alimentação':15,'🚗 Transporte':10,'🎓 Educação':5,'💊 Saúde':5,'🎮 Lazer':10,'👔 Pessoal':5,'📈 Investimento':10,'🛡️ Reserva':10};

let currentYear=2026, currentMonth=9;
let data={};
let nextId=1000;

function dataKey(y,m){return y+'-'+(m<9?'0':'')+(m+1)}
function loadData(){
    let saved=localStorage.getItem('finconsult_modelo_data');
    if(saved){data=JSON.parse(saved);return}
    initDefaultData();
}
function saveData(){localStorage.setItem('finconsult_modelo_data',JSON.stringify(data))}

function initDefaultData(){
    data={years:[2026,2027,2028],saldo:{conta:0,reserva:0,investimento:0},removed:{}};

    const recRevenues=[
        {name:'Salário',value:3500,day:5,recurring:true,category:''},
        {name:'Renda Extra',value:500,day:20,recurring:true,category:''}
    ];

    const recExpenses=[
        {name:'Aluguel',value:1200,day:10,recurring:true,category:'🏠 Moradia'},
        {name:'Energia',value:180,day:8,recurring:true,category:'🏠 Moradia'},
        {name:'Água',value:80,day:5,recurring:true,category:'🏠 Moradia'},
        {name:'Internet',value:100,day:12,recurring:true,category:'🏠 Moradia'},
        {name:'Supermercado',value:600,day:1,recurring:true,category:'🍔 Alimentação'},
        {name:'Transporte',value:300,day:1,recurring:true,category:'🚗 Transporte'},
        {name:'Plano de Saúde',value:250,day:15,recurring:true,category:'💊 Saúde'},
        {name:'Academia',value:90,day:5,recurring:true,category:'👔 Pessoal'},
        {name:'Celular',value:60,day:18,recurring:true,category:'📦 Outros'},
        {name:'Streaming',value:55,day:1,recurring:true,category:'🎮 Lazer'}
    ];

    const sampleExpenses=[
        {name:'Parcela Empréstimo',value:350,day:22,recurring:false,category:'💳 Dívidas',installment:3,totalInstallments:12},
        {name:'Cartão de Crédito',value:400,day:25,recurring:false,category:'💳 Dívidas'}
    ];

    data.years.forEach(function(y){
        for(let m=0;m<12;m++){
            let key=dataKey(y,m);
            let revenues=[];
            let expenses=[];

            recRevenues.forEach(function(r){
                revenues.push({id:nextId++,name:r.name,value:r.value,day:r.day,recurring:true,paid:isPast(y,m),category:r.category});
            });

            recExpenses.forEach(function(e){
                expenses.push({id:nextId++,name:e.name,value:e.value,day:e.day,recurring:true,paid:isPast(y,m),category:e.category});
            });

            if(y===2026 && m>=9 && m<=11){
                let inst=3+(m-9);
                expenses.push({id:nextId++,name:'Parcela Empréstimo',value:350,day:22,recurring:false,paid:isPast(y,m),category:'💳 Dívidas',installment:inst,totalInstallments:12});
            }
            if(y===2027 && m<=5){
                let inst=6+m;
                expenses.push({id:nextId++,name:'Parcela Empréstimo',value:350,day:22,recurring:false,paid:false,category:'💳 Dívidas',installment:inst,totalInstallments:12});
            }

            if(y===2026 && m===9){
                expenses.push({id:nextId++,name:'Cartão de Crédito',value:400,day:25,recurring:false,paid:false,category:'💳 Dívidas'});
            }

            data[key]={revenues:revenues,expenses:expenses};
        }
    });

    data.showWelcome=true;
    saveData();
}

function isPast(y,m){
    let now=new Date();
    let checkDate=new Date(y,m+1,0);
    return checkDate<new Date(now.getFullYear(),now.getMonth(),1);
}

function isCurrent(y,m){
    let now=new Date();
    return y===now.getFullYear() && m===now.getMonth();
}

function render(){
    renderYearTabs();
    renderChart();
    renderSummary();
    renderCategories();
    renderRevenues();
    renderExpenses();
    renderWelcome();
    document.getElementById('monthLabel').textContent=MONTHS[currentMonth]+' '+currentYear;
}

function renderYearTabs(){
    let html='';
    (data.years||[2026]).sort().forEach(function(y){
        html+='<button class="'+(y===currentYear?'active':'')+'" onclick="switchYear('+y+')">'+y+'</button>';
    });
    html+='<button class="yr-add" onclick="addYear()">+</button>';
    html+='<button class="yr-del" onclick="deleteYear()">🗑️</button>';
    document.getElementById('yearTabs').innerHTML=html;
}

function renderChart(){
    let area=document.getElementById('chartArea');
    let html='';
    let maxAbs=1;
    let results=[];
    let greenCount=0,redCount=0,totalResult=0;

    for(let m=0;m<12;m++){
        let key=dataKey(currentYear,m);
        let d=data[key];
        if(!d||isRemoved(currentYear,m)){results.push(null);continue}
        let rev=d.revenues.reduce(function(s,r){return s+r.value},0);
        let exp=d.expenses.reduce(function(s,e){return s+e.value},0);
        let result=rev-exp;
        results.push(result);
        if(Math.abs(result)>maxAbs)maxAbs=Math.abs(result);
    }

    for(let m=0;m<12;m++){
        if(results[m]===null)continue;
        let result=results[m];
        let pct=Math.min(Math.abs(result)/maxAbs*100,100);
        let cls=result>=0?'positive':'negative';
        let now=new Date();
        let timeClass=isCurrent(currentYear,m)?'current':(new Date(currentYear,m,1)>now?'future':'');

        if(result>=0)greenCount++;else redCount++;
        totalResult+=result;

        let label=MONTHS[m].substring(0,3);
        let events=getEvent(currentYear,m);

        html+='<div class="chart-row">';
        html+='<div class="chart-label">'+label+'</div>';
        html+='<div class="chart-bar-container"><div class="chart-bar '+cls+' '+timeClass+'" style="width:'+pct+'%"></div></div>';
        html+='<div class="chart-value '+cls+'">'+(result>=0?'+':'')+formatVal(result)+'</div>';
        if(events)html+='<div class="chart-event">'+events+'</div>';
        html+='</div>';
    }

    area.innerHTML=html;

    let sumHtml='<span>🟢 '+greenCount+' meses</span>';
    sumHtml+='<span>🔴 '+redCount+' meses</span>';
    sumHtml+='<span style="color:'+(totalResult>=0?'#27ae60':'#e74c3c')+'">Ano: '+(totalResult>=0?'+':'')+formatVal(totalResult)+'</span>';
    document.getElementById('chartSummary').innerHTML=sumHtml;
}

function getEvent(y,m){
    let events={};
    events['2026-11']='🎄';
    events['2027-0']='🎉 Ano Novo';
    let key=y+'-'+m;
    return events[key]||'';
}

function renderSummary(){
    let key=dataKey(currentYear,currentMonth);
    let d=data[key];
    if(!d){document.getElementById('summaryArea').innerHTML='<p style="text-align:center;padding:20px;color:#999">Mês não configurado</p>';return}

    let totalRev=d.revenues.reduce(function(s,r){return s+r.value},0);
    let totalExp=d.expenses.reduce(function(s,e){return s+e.value},0);
    let totalPaid=d.expenses.filter(function(e){return e.paid}).reduce(function(s,e){return s+e.value},0);
    let totalPending=totalExp-totalPaid;
    let remaining=totalRev-totalExp;

    let remainClass,remainBg,remainLabel;
    if(remaining>500){remainClass='green';remainBg='bg-green';remainLabel='SOBRA'}
    else if(remaining>=0){remainClass='green';remainBg='bg-yellow';remainLabel='SOBRA'}
    else{remainClass='red';remainBg='bg-red';remainLabel='FALTA'}

    let pctUsed=totalRev>0?Math.round(totalExp/totalRev*100):0;
    let alertHtml='';
    if(pctUsed>=100)alertHtml='<div class="alert-bar bg-red" style="color:#c0392b">🚨 ESTOUROU! Gastando mais do que ganha!</div>';
    else if(pctUsed>=95)alertHtml='<div class="alert-bar bg-red" style="color:#c0392b">🔴 PERIGO: '+pctUsed+'% da renda comprometida</div>';
    else if(pctUsed>=85)alertHtml='<div class="alert-bar bg-yellow" style="color:#e67e22">🟠 Cuidado: '+pctUsed+'% da renda usada</div>';
    else if(pctUsed>=70)alertHtml='<div class="alert-bar bg-yellow" style="color:#f39c12">🟡 Atenção: '+pctUsed+'% da renda comprometida</div>';
    else if(pctUsed>=50)alertHtml='<div class="alert-bar bg-green" style="color:#27ae60">🟢 '+pctUsed+'% da renda usada. No ritmo.</div>';

    let saldoHtml='';
    if(data.saldo && (data.saldo.conta>0||data.saldo.reserva>0||data.saldo.investimento>0)){
        saldoHtml='<div class="saldo-section">';
        saldoHtml+='<div style="font-size:12px;font-weight:700;margin-bottom:4px">💰 Ponto de Partida</div>';
        if(data.saldo.conta>0)saldoHtml+='<div class="saldo-row"><span>Saldo em conta:</span><span>R$ '+formatVal(data.saldo.conta)+'</span></div>';
        if(data.saldo.reserva>0)saldoHtml+='<div class="saldo-row"><span>Reserva de emergência:</span><span>R$ '+formatVal(data.saldo.reserva)+'</span></div>';
        if(data.saldo.investimento>0)saldoHtml+='<div class="saldo-row"><span>Investimentos:</span><span>R$ '+formatVal(data.saldo.investimento)+'</span></div>';
        saldoHtml+='</div>';
    }

    let html=saldoHtml;
    html+='<div class="summary-grid">';
    html+='<div class="summary-item"><div class="label">💵 Receita</div><div class="value green">R$ '+formatVal(totalRev)+'</div></div>';
    html+='<div class="summary-item"><div class="label">💸 Total Contas</div><div class="value red">R$ '+formatVal(totalExp)+'</div></div>';
    html+='<div class="summary-item"><div class="label">✅ Pago</div><div class="value">R$ '+formatVal(totalPaid)+'</div></div>';
    html+='<div class="summary-item"><div class="label">⏳ Pendente</div><div class="value">R$ '+formatVal(totalPending)+'</div></div>';
    html+='<div class="summary-remaining '+remainBg+'"><div class="label">📊 '+remainLabel+'</div><div class="value '+remainClass+'">R$ '+formatVal(Math.abs(remaining))+'</div></div>';
    html+='</div>';
    html+=alertHtml;

    document.getElementById('summaryArea').innerHTML=html;
}

function renderCategories(){
    let key=dataKey(currentYear,currentMonth);
    let d=data[key];
    if(!d)return;

    let totalRev=d.revenues.reduce(function(s,r){return s+r.value},0);
    let cats={};
    d.expenses.forEach(function(e){
        let cat=e.category||'📦 Outros';
        if(!cats[cat])cats[cat]=0;
        cats[cat]+=e.value;
    });

    let html='';
    let maxCat=Math.max.apply(null,Object.values(cats).concat([1]));

    Object.keys(cats).sort().forEach(function(cat){
        let val=cats[cat];
        let pct=Math.round(val/maxCat*100);
        let suggested=SUGGEST_PCT[cat];
        let sugVal=suggested?Math.round(totalRev*suggested/100):0;
        let status='',statusColor='';

        if(suggested){
            if(val<=sugVal){status='🟢';statusColor='#27ae60'}
            else{status='🔴';statusColor='#e74c3c'}
        }

        html+='<div class="cat-row">';
        html+='<span style="flex:1">'+cat+'</span>';
        html+='<span style="width:70px;text-align:right;font-weight:600">R$ '+formatVal(val)+'</span>';
        if(suggested){
            html+='<span style="width:70px;text-align:right;font-size:10px;color:#999">/ R$ '+formatVal(sugVal)+'</span>';
            html+='<span style="width:20px;text-align:center">'+status+'</span>';
        }
        html+='</div>';
    });

    document.getElementById('catContent').innerHTML=html;
}

function toggleCat(){
    let el=document.getElementById('catContent');
    el.style.display=el.style.display==='none'?'block':'none';
}

function renderRevenues(){
    let key=dataKey(currentYear,currentMonth);
    let d=data[key];
    if(!d)return;

    let html='<div class="section-title">💵 Receitas</div>';
    d.revenues.sort(function(a,b){return a.day-b.day}).forEach(function(r){
        html+=renderItem(r,'revenue');
    });
    document.getElementById('revenueSection').innerHTML=html;
}

function renderExpenses(){
    let key=dataKey(currentYear,currentMonth);
    let d=data[key];
    if(!d)return;

    let pending=d.expenses.filter(function(e){return!e.paid}).sort(function(a,b){return a.day-b.day});
    let paid=d.expenses.filter(function(e){return e.paid}).sort(function(a,b){return a.day-b.day});

    let html='<div class="section-title">📋 Contas Pendentes ('+pending.length+')</div>';
    pending.forEach(function(e){html+=renderItem(e,'expense')});
    document.getElementById('pendingSection').innerHTML=html;

    if(paid.length>0){
        document.getElementById('paidSeparator').innerHTML='<div class="separator">✅ Contas Pagas ('+paid.length+')</div>';
        let paidHtml='';
        paid.forEach(function(e){paidHtml+=renderItem(e,'expense',true)});
        document.getElementById('paidSection').innerHTML=paidHtml;
    }else{
        document.getElementById('paidSeparator').innerHTML='';
        document.getElementById('paidSection').innerHTML='';
    }
}

function renderItem(item,type,isPaid){
    let valClass=type==='revenue'?'income':'expense';
    let prefix=type==='revenue'?'+':'-';
    let detail='Dia '+item.day;
    if(item.category)detail+=' • '+item.category;
    if(item.installment&&item.totalInstallments)detail+=' • '+item.installment+'/'+item.totalInstallments;
    if(item.recurring)detail+=' • 🔄';

    let html='<div class="item'+(isPaid?' paid':'')+'">';
    html+='<div class="item-check'+(item.paid?' checked':'')+'" onclick="togglePaid(\''+type+'\','+item.id+')">'+(item.paid?'✓':'')+'</div>';
    html+='<div class="item-info"><div class="item-name">'+item.name+'</div><div class="item-detail">'+detail+'</div></div>';
    html+='<div class="item-value '+valClass+'">'+prefix+'R$ '+formatVal(item.value)+'</div>';
    html+='<div class="item-actions">';
    html+='<button onclick="editItem(\''+type+'\','+item.id+')">✏️</button>';
    html+='<button onclick="deleteItem(\''+type+'\','+item.id+')">🗑️</button>';
    html+='</div></div>';
    return html;
}

function togglePaid(type,id){
    let key=dataKey(currentYear,currentMonth);
    let list=type==='revenue'?data[key].revenues:data[key].expenses;
    let item=list.find(function(i){return i.id===id});
    if(item){item.paid=!item.paid;saveData();render()}
}

function openModal(type,editId){
    let key=dataKey(currentYear,currentMonth);
    if(!data[key]){data[key]={revenues:[],expenses:[]};saveData()}

    let item=null;
    if(editId){
        let list=type==='revenue'?data[key].revenues:data[key].expenses;
        item=list.find(function(i){return i.id===editId});
    }

    let title=editId?(type==='revenue'?'Editar Receita':'Editar Conta'):(type==='revenue'?'Nova Receita':'Nova Conta');

    let html='<h3>'+title+'</h3>';
    html+='<label>Nome</label><input type="text" id="mName" value="'+(item?item.name:'')+'">';
    html+='<label>Valor (R$)</label><input type="number" id="mValue" inputmode="decimal" value="'+(item?item.value:'')+'">';
    html+='<label>Dia do Vencimento</label><input type="number" id="mDay" inputmode="numeric" value="'+(item?item.day:'')+'">';

    if(type==='expense'){
        html+='<label>Categoria</label><select id="mCat">';
        CATEGORIES.forEach(function(c){
            html+='<option value="'+c+'"'+(item&&item.category===c?' selected':'')+'>'+c+'</option>';
        });
        html+='</select>';

        html+='<div class="toggle-row"><span style="font-size:12px">Parcelado?</span><div class="toggle'+(item&&item.totalInstallments?' active':'')+'" id="mInstToggle" onclick="toggleInstallment()"></div></div>';
        html+='<div id="mInstFields" style="display:'+(item&&item.totalInstallments?'block':'none')+'">';
        html+='<label>Parcela Atual</label><input type="number" id="mInst" inputmode="numeric" value="'+(item&&item.installment?item.installment:1)+'">';
        html+='<label>Total de Parcelas</label><input type="number" id="mTotalInst" inputmode="numeric" value="'+(item&&item.totalInstallments?item.totalInstallments:'')+'">';
        html+='</div>';
    }

    html+='<div class="toggle-row"><span style="font-size:12px">🔄 Recorrente?</span><div class="toggle'+(item&&item.recurring?' active':'')+'" id="mRecToggle" onclick="this.classList.toggle(\'active\')"></div></div>';

    html+='<div class="modal-buttons">';
    html+='<button class="btn-cancel" onclick="closeModal()">Cancelar</button>';
    html+='<button class="btn-save" onclick="saveItem(\''+type+'\','+(editId||0)+')">Salvar</button>';
    html+='</div>';

    document.getElementById('modalContent').innerHTML=html;
    document.getElementById('modalOverlay').classList.add('active');
}

function toggleInstallment(){
    let toggle=document.getElementById('mInstToggle');
    toggle.classList.toggle('active');
    document.getElementById('mInstFields').style.display=toggle.classList.contains('active')?'block':'none';
}

function closeModal(){document.getElementById('modalOverlay').classList.remove('active')}

function saveItem(type,editId){
    let name=document.getElementById('mName').value.trim();
    let value=parseFloat(document.getElementById('mValue').value)||0;
    let day=parseInt(document.getElementById('mDay').value)||1;
    let recurring=document.getElementById('mRecToggle').classList.contains('active');
    let category='';
    let installment=0,totalInstallments=0;

    if(type==='expense'){
        category=document.getElementById('mCat').value;
        let instToggle=document.getElementById('mInstToggle');
        if(instToggle&&instToggle.classList.contains('active')){
            installment=parseInt(document.getElementById('mInst').value)||1;
            totalInstallments=parseInt(document.getElementById('mTotalInst').value)||1;
        }
    }

    if(!name||!value){alert('Preencha nome e valor');return}

    let key=dataKey(currentYear,currentMonth);
    if(!data[key])data[key]={revenues:[],expenses:[]};
    let list=type==='revenue'?data[key].revenues:data[key].expenses;

    if(editId){
        let item=list.find(function(i){return i.id===editId});
        if(item){
            item.name=name;item.value=value;item.day=day;item.recurring=recurring;item.category=category;
            if(totalInstallments){item.installment=installment;item.totalInstallments=totalInstallments}
            else{delete item.installment;delete item.totalInstallments}
        }
    }else{
        let newItem={id:nextId++,name:name,value:value,day:day,recurring:recurring,paid:false,category:category};
        if(totalInstallments){newItem.installment=installment;newItem.totalInstallments=totalInstallments}
        list.push(newItem);
    }

    if(recurring||totalInstallments){
        propagateItem(type,name,value,day,recurring,category,installment,totalInstallments);
    }

    saveData();closeModal();render();
}

function propagateItem(type,name,value,day,recurring,category,installment,totalInstallments){
    let startMonth=currentMonth+1;
    let startYear=currentYear;

    if(startMonth>11){startMonth=0;startYear++}

    let monthsToPropagate=recurring?24:(totalInstallments?totalInstallments-installment:0);

    for(let i=0;i<monthsToPropagate;i++){
        let m=startMonth+i;
        let y=startYear;
        while(m>11){m-=12;y++}

        if(!data.years||data.years.indexOf(y)===-1)continue;

        let key=dataKey(y,m);
        if(!data[key])data[key]={revenues:[],expenses:[]};

        let list=type==='revenue'?data[key].revenues:data[key].expenses;

        let exists=list.find(function(item){return item.name===name&&item.day===day});
        if(exists)continue;

        let newItem={id:nextId++,name:name,value:value,day:day,recurring:recurring,paid:false,category:category};

        if(totalInstallments){
            let newInst=installment+i+1;
            if(newInst>totalInstallments)break;
            newItem.installment=newInst;
            newItem.totalInstallments=totalInstallments;
            newItem.recurring=false;
        }

        list.push(newItem);
    }
}

function editItem(type,id){openModal(type,id)}

function deleteItem(type,id){
    if(!confirm('Excluir este item?'))return;
    let key=dataKey(currentYear,currentMonth);
    let list=type==='revenue'?data[key].revenues:data[key].expenses;
    let idx=list.findIndex(function(i){return i.id===id});
    if(idx>-1)list.splice(idx,1);
    saveData();render();
}

function changeMonth(dir){
    currentMonth+=dir;
    if(currentMonth>11){currentMonth=0;currentYear++}
    if(currentMonth<0){currentMonth=11;currentYear--}

    let key=dataKey(currentYear,currentMonth);
    if(!data[key]){
        data[key]={revenues:[],expenses:[]};
        generateRecurring(currentYear,currentMonth);
    }

    if(data.years&&data.years.indexOf(currentYear)===-1){
        data.years.push(currentYear);data.years.sort();
    }

    saveData();render();
}

function generateRecurring(y,m){
    let prevMonth=m-1,prevYear=y;
    if(prevMonth<0){prevMonth=11;prevYear--}
    let prevKey=dataKey(prevYear,prevMonth);
    let prev=data[prevKey];
    if(!prev)return;

    let key=dataKey(y,m);

    prev.revenues.filter(function(r){return r.recurring}).forEach(function(r){
        let exists=data[key].revenues.find(function(x){return x.name===r.name&&x.day===r.day});
        if(!exists)data[key].revenues.push({id:nextId++,name:r.name,value:r.value,day:r.day,recurring:true,paid:false,category:r.category||''});
    });

    prev.expenses.filter(function(e){return e.recurring}).forEach(function(e){
        let exists=data[key].expenses.find(function(x){return x.name===e.name&&x.day===e.day});
        if(!exists)data[key].expenses.push({id:nextId++,name:e.name,value:e.value,day:e.day,recurring:true,paid:false,category:e.category||''});
    });
}

function switchYear(y){currentYear=y;if(currentMonth>11)currentMonth=0;render()}

function addYear(){
    let y=prompt('Qual ano deseja adicionar?');
    if(!y)return;
    y=parseInt(y);
    if(isNaN(y)||y<2020||y>2050){alert('Ano inválido');return}
    if(!data.years)data.years=[2026];
    if(data.years.indexOf(y)>-1){alert('Ano já existe');return}
    data.years.push(y);data.years.sort();

    for(let m=0;m<12;m++){
        let key=dataKey(y,m);
        if(!data[key]){
            data[key]={revenues:[],expenses:[]};
            generateRecurring(y,m);
        }
    }

    currentYear=y;currentMonth=0;
    saveData();render();
}

function deleteYear(){
    let y=prompt('Qual ano deseja EXCLUIR?\n('+data.years.join(', ')+')');
    if(!y)return;
    y=parseInt(y);
    if(data.years.indexOf(y)===-1){alert('Ano não encontrado');return}
    if(data.years.length<=1){alert('Precisa ter pelo menos um ano');return}
    if(!confirm('Excluir o ano '+y+'? Todos os dados serão perdidos!'))return;

    data.years=data.years.filter(function(yr){return yr!==y});
    for(let m=0;m<12;m++){delete data[dataKey(y,m)]}

    currentYear=data.years[0];
    saveData();render();
}

function removeMonth(){
    if(!confirm('Remover '+MONTHS[currentMonth]+'/'+currentYear+' do gráfico?'))return;
    if(!data.removed)data.removed={};
    data.removed[dataKey(currentYear,currentMonth)]=true;
    saveData();render();
}

function isRemoved(y,m){return data.removed&&data.removed[dataKey(y,m)]}

function openSaldo(){
    let s=data.saldo||{conta:0,reserva:0,investimento:0};
    let html='<h3>⚙️ Ponto de Partida</h3>';
    html+='<p style="font-size:12px;color:#666;margin-bottom:10px">Informe seus saldos atuais para uma projeção mais precisa.</p>';
    html+='<label>💰 Saldo em Conta</label><input type="number" id="sConta" inputmode="decimal" value="'+(s.conta||'')+'">';
    html+='<label>🛡️ Reserva de Emergência</label><input type="number" id="sReserva" inputmode="decimal" value="'+(s.reserva||'')+'">';
    html+='<label>📈 Investimentos</label><input type="number" id="sInvest" inputmode="decimal" value="'+(s.investimento||'')+'">';
    html+='<div class="modal-buttons">';
    html+='<button class="btn-cancel" onclick="closeModal()">Cancelar</button>';
    html+='<button class="btn-save" onclick="saveSaldo()">Salvar</button>';
    html+='</div>';

    document.getElementById('modalContent').innerHTML=html;
    document.getElementById('modalOverlay').classList.add('active');
}

function saveSaldo(){
    data.saldo={
        conta:parseFloat(document.getElementById('sConta').value)||0,
        reserva:parseFloat(document.getElementById('sReserva').value)||0,
        investimento:parseFloat(document.getElementById('sInvest').value)||0
    };
    saveData();closeModal();render();
}

function openSuggestion(){
    let el=document.getElementById('suggestSection');
    let key=dataKey(currentYear,currentMonth);
    let d=data[key];
    if(!d)return;

    let totalRev=d.revenues.reduce(function(s,r){return s+r.value},0);

    let html='<div style="text-align:center;font-size:13px;font-weight:600;margin-bottom:8px">Renda do mês: R$ '+formatVal(totalRev)+'</div>';
    html+='<div style="font-size:10px;color:#666;text-align:center;margin-bottom:8px">Base: 50% necessidades / 30% desejos / 20% futuro</div>';

    let actuals={};
    d.expenses.forEach(function(e){
        let cat=e.category||'📦 Outros';
        if(!actuals[cat])actuals[cat]=0;
        actuals[cat]+=e.value;
    });

    Object.keys(SUGGEST_PCT).forEach(function(cat){
        let pct=SUGGEST_PCT[cat];
        let suggested=Math.round(totalRev*pct/100);
        let actual=actuals[cat]||0;
        let diff=actual-suggested;
        let status=diff<=0?'🟢':'🔴';

        html+='<div class="suggest-row">';
        html+='<span>'+cat+' ('+pct+'%)</span>';
        html+='<span>R$ '+formatVal(suggested)+'</span>';
        html+='<span style="font-size:11px;color:'+(diff<=0?'#27ae60':'#e74c3c')+'">Real: R$ '+formatVal(actual)+' '+status+'</span>';
        html+='</div>';
    });

    document.getElementById('suggestContent').innerHTML=html;
    el.style.display='block';
}

function closeSuggestion(){document.getElementById('suggestSection').style.display='none'}

function generatePDF(scope){
    let key=dataKey(currentYear,currentMonth);
    let d=data[key];
    if(!d){alert('Sem dados para gerar PDF');return}

    let content='';

    if(scope==='month'){
        let totalRev=d.revenues.reduce(function(s,r){return s+r.value},0);
        let totalExp=d.expenses.reduce(function(s,e){return s+e.value},0);
        let remaining=totalRev-totalExp;

        content+='<h1 style="text-align:center;color:#1a1a2e">💰 FinConsult — Resumo Mensal</h1>';
        content+='<h2 style="text-align:center;color:#666">'+MONTHS[currentMonth]+'/'+currentYear+'</h2>';
        content+='<hr>';
        content+='<h3>📊 Resumo</h3>';
        content+='<p style="color:#27ae60"><b>Receita:</b> R$ '+formatVal(totalRev)+'</p>';
        content+='<p style="color:#e74c3c"><b>Total Contas:</b> R$ '+formatVal(totalExp)+'</p>';
        content+='<p style="color:'+(remaining>=0?'#27ae60':'#e74c3c')+'"><b>'+(remaining>=0?'Sobra':'Falta')+':</b> R$ '+formatVal(Math.abs(remaining))+'</p>';
        content+='<hr>';
        content+='<h3>💵 Receitas</h3>';
        d.revenues.sort(function(a,b){return a.day-b.day}).forEach(function(r){
            content+='<p>'+(r.paid?'✅':'⬜')+' '+r.name+' (dia '+r.day+') — +R$ '+formatVal(r.value)+'</p>';
        });
        content+='<hr>';
        content+='<h3>📋 Contas</h3>';
        d.expenses.sort(function(a,b){return a.day-b.day}).forEach(function(e){
            let detail=e.category?' ['+e.category+']':'';
            if(e.installment)detail+=' '+e.installment+'/'+e.totalInstallments;
            content+='<p>'+(e.paid?'✅':'⬜')+' '+e.name+detail+' (dia '+e.day+') — -R$ '+formatVal(e.value)+'</p>';
        });

        let cats={};
        d.expenses.forEach(function(e){let c=e.category||'📦 Outros';if(!cats[c])cats[c]=0;cats[c]+=e.value});
        content+='<hr><h3>📊 Por Categoria</h3>';
        Object.keys(cats).sort().forEach(function(c){
            content+='<p>'+c+': R$ '+formatVal(cats[c])+'</p>';
        });
    }else{
        content+='<h1 style="text-align:center;color:#1a1a2e">💰 FinConsult — Resumo Anual</h1>';
        content+='<h2 style="text-align:center;color:#666">'+currentYear+'</h2>';
        content+='<hr>';

        let yearTotal=0,greenM=0,redM=0;
        content+='<h3>📈 Projeção por Mês</h3>';
        for(let m=0;m<12;m++){
            let mk=dataKey(currentYear,m);
            let md=data[mk];
            if(!md||isRemoved(currentYear,m))continue;
            let rev=md.revenues.reduce(function(s,r){return s+r.value},0);
            let exp=md.expenses.reduce(function(s,e){return s+e.value},0);
            let res=rev-exp;
            yearTotal+=res;
            if(res>=0)greenM++;else redM++;
            content+='<p style="color:'+(res>=0?'#27ae60':'#e74c3c')+'">'+MONTHS[m]+': '+(res>=0?'+':'')+' R$ '+formatVal(res)+'</p>';
        }
        content+='<hr>';
        content+='<p><b>🟢 Meses positivos:</b> '+greenM+'</p>';
        content+='<p><b>🔴 Meses negativos:</b> '+redM+'</p>';
        content+='<p style="font-size:18px;color:'+(yearTotal>=0?'#27ae60':'#e74c3c')+'"><b>Resultado do Ano: '+(yearTotal>=0?'+':'')+' R$ '+formatVal(yearTotal)+'</b></p>';
    }

    content+='<hr><p style="text-align:center;color:#999;font-size:12px">Gerado em '+new Date().toLocaleString('pt-BR')+' — FinConsult</p>';

    let win=window.open('','_blank');
    if(win){
        win.document.write('<html><head><title>FinConsult PDF</title><meta name="viewport" content="width=device-width"><style>body{font-family:Arial,sans-serif;max-width:600px;margin:20px auto;padding:0 15px;font-size:14px}h1{font-size:20px}h2{font-size:16px}h3{font-size:14px;margin-top:15px}hr{border:none;border-top:1px solid #ddd;margin:10px 0}p{margin:4px 0}</style></head><body>');
        win.document.write(content);
        win.document.write('</body></html>');
        win.document.close();
    }else{
        alert('Permita pop-ups para gerar o PDF');
    }
}

function formatVal(v){
    if(v===undefined||v===null)return'0';
    return Math.abs(v).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0});
}
