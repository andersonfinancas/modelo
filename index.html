<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>FinConsult</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#fff;color:#1a1a2e;max-width:500px;margin:0 auto;padding-bottom:30px}
.header{background:#1a1a2e;color:#fff;padding:12px;text-align:center;position:sticky;top:0;z-index:100}
.header h1{font-size:16px;margin-bottom:4px}
.month-nav{display:flex;align-items:center;justify-content:center;gap:12px}
.month-nav button{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;padding:4px 8px}
.month-nav span{font-size:15px;font-weight:600;min-width:140px}
.year-nav{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px;flex-wrap:wrap}
.year-nav button{background:rgba(255,255,255,0.2);border:none;color:#fff;font-size:11px;cursor:pointer;padding:3px 10px;border-radius:10px}
.year-nav .active{background:rgba(255,255,255,0.5);font-weight:700}
.year-nav .add-year,.year-nav .del-year{font-size:14px;padding:2px 8px}
.chart-section{padding:10px 12px;background:#f8f9fa;border-bottom:1px solid #eee}
.chart-title{font-size:13px;font-weight:600;margin-bottom:8px;text-align:center}
.chart-row{display:flex;align-items:center;margin-bottom:4px;font-size:12px}
.chart-month{width:32px;font-weight:600;flex-shrink:0}
.chart-icon{width:18px;flex-shrink:0;font-size:10px}
.chart-bar-container{flex:1;height:18px;background:#eee;border-radius:4px;overflow:hidden;position:relative}
.chart-bar{height:100%;border-radius:4px;min-width:2px;transition:width 0.3s}
.chart-bar.positive{background:#27ae60}
.chart-bar.negative{background:#e74c3c}
.chart-bar.future{opacity:0.5}
.chart-bar.current{border:2px solid #f39c12}
.chart-value{width:75px;text-align:right;font-size:11px;font-weight:600;flex-shrink:0;padding-left:4px}
.chart-event{font-size:9px;margin-left:4px;flex-shrink:0;max-width:70px;overflow:hidden;white-space:nowrap}
.chart-summary{display:flex;justify-content:center;gap:15px;margin-top:6px;font-size:11px;font-weight:600}
.summary{padding:12px}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.summary-item{padding:8px;border-radius:8px;background:#f8f9fa}
.summary-item .label{font-size:11px;color:#666}
.summary-item .value{font-size:16px;font-weight:700}
.summary-item .value.green{color:#27ae60}
.summary-item .value.red{color:#e74c3c}
.summary-remaining{text-align:center;padding:12px;border-radius:10px;margin-top:4px}
.summary-remaining .label{font-size:12px;font-weight:600}
.summary-remaining .value{font-size:22px;font-weight:800}
.summary-remaining.positive{background:#e8f5e9}
.summary-remaining .value.green{color:#27ae60}
.summary-remaining.negative{background:#fce4ec}
.summary-remaining .value.red{color:#e74c3c}
.summary-remaining.warning{background:#fff8e1}
.summary-remaining .value.yellow{color:#f39c12}
.alert-bar{text-align:center;padding:4px;font-size:11px;font-weight:600;border-radius:6px;margin-top:6px}
.alert-bar.green{background:#e8f5e9;color:#27ae60}
.alert-bar.yellow{background:#fff8e1;color:#f39c12}
.alert-bar.orange{background:#fff3e0;color:#e67e22}
.alert-bar.red{background:#fce4ec;color:#e74c3c}
.alert-bar.critical{background:#b71c1c;color:#fff}
.add-buttons{display:flex;gap:8px;padding:8px 12px}
.add-btn{flex:1;padding:10px;border:2px dashed #ccc;border-radius:8px;background:none;font-size:14px;cursor:pointer;color:#555;font-weight:600}
.add-btn:active{background:#f0f0f0}
.section{padding:8px 12px}
.section-title{font-size:14px;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.section-title.clickable{cursor:pointer}
.item{display:flex;align-items:center;padding:10px;border-radius:8px;background:#f8f9fa;margin-bottom:5px}
.item.paid{opacity:0.5}
.item.paid .item-name{text-decoration:line-through}
.item-check{width:22px;height:22px;border:2px solid #ccc;border-radius:50%;margin-right:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px}
.item-check.checked{background:#27ae60;border-color:#27ae60;color:#fff}
.item-info{flex:1;min-width:0}
.item-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-detail{font-size:11px;color:#888}
.item-value{font-size:14px;font-weight:700;flex-shrink:0;margin-left:6px}
.item-value.income{color:#27ae60}
.item-value.expense{color:#e74c3c}
.item-actions{display:flex;gap:2px;margin-left:4px;flex-shrink:0}
.item-actions button{background:none;border:none;font-size:14px;cursor:pointer;padding:3px}
.separator{text-align:center;font-size:11px;color:#999;margin:10px 0 6px;padding:4px;border-top:1px solid #eee}
.cat-section{padding:8px 12px}
.cat-row{display:flex;align-items:center;font-size:12px;padding:5px 0;border-bottom:1px solid #f0f0f0}
.cat-icon{width:22px}
.cat-name{flex:1;font-weight:500}
.cat-real{width:70px;text-align:right;font-weight:600}
.cat-sug{width:70px;text-align:right;color:#888}
.cat-status{width:28px;text-align:center}
.cat-header{font-weight:700;font-size:11px;color:#888;border-bottom:2px solid #ddd;padding-bottom:4px;margin-bottom:2px}
.bottom-buttons{display:flex;gap:6px;padding:8px 12px;justify-content:center;flex-wrap:wrap}
.bottom-btn{padding:8px 14px;border:1px solid #ddd;border-radius:8px;background:#f8f9fa;font-size:12px;cursor:pointer;color:#555;font-weight:500}
.bottom-btn:active{background:#e0e0e0}
.pdf-buttons{display:flex;gap:8px;padding:8px 12px;justify-content:center}
.pdf-btn{padding:8px 14px;border:none;border-radius:8px;background:#1a1a2e;color:#fff;font-size:12px;cursor:pointer;font-weight:600}
.pdf-btn:active{opacity:0.8}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:200;justify-content:center;align-items:center}
.modal-overlay.active{display:flex}
.modal{background:#fff;border-radius:12px;padding:16px;width:90%;max-width:400px;max-height:80vh;overflow-y:auto}
.modal h3{margin-bottom:12px;font-size:16px}
.modal label{display:block;margin-bottom:4px;font-size:12px;color:#666;font-weight:600}
.modal input,.modal select{width:100%;padding:9px;border:1px solid #ddd;border-radius:8px;font-size:15px;margin-bottom:10px;-webkit-appearance:none}
.modal-row{display:flex;gap:8px}
.modal-row>div{flex:1}
.modal-buttons{display:flex;gap:8px;margin-top:8px}
.modal-buttons button{flex:1;padding:10px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
.btn-save{background:#1a1a2e;color:#fff}
.btn-cancel{background:#f0f0f0;color:#333}
.btn-delete{background:#e74c3c;color:#fff}
.toggle-container{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.toggle{width:44px;height:24px;background:#ddd;border-radius:12px;position:relative;cursor:pointer;transition:background 0.3s}
.toggle.active{background:#27ae60}
.toggle::after{content:'';position:absolute;width:20px;height:20px;background:#fff;border-radius:50%;top:2px;left:2px;transition:left 0.3s}
.toggle.active::after{left:22px}
.toggle-label{font-size:13px;color:#555}
</style>
</head>
<body>

<div class="header">
<h1>💰 FinConsult</h1>
<div class="month-nav">
<button onclick="changeMonth(-1)">◀</button>
<span id="monthLabel"></span>
<button onclick="changeMonth(1)">▶</button>
</div>
<div class="year-nav" id="yearNav"></div>
</div>

<div class="chart-section">
<div class="chart-title" id="chartTitle">📈 Projeção 2026</div>
<div id="chartContainer"></div>
<div class="chart-summary" id="chartSummary"></div>
</div>

<div class="summary" id="summarySection"></div>

<div class="add-buttons">
<button class="add-btn" onclick="openModal('revenue')">+ Receita</button>
<button class="add-btn" onclick="openModal('expense')">+ Conta</button>
</div>

<div class="cat-section" id="catSection"></div>

<div class="section" id="revenueSection"></div>
<div class="section" id="pendingSection"></div>
<div class="section" id="paidSection"></div>

<div class="bottom-buttons">
<button class="bottom-btn" onclick="openSuggestion()">💡 Sugestão</button>
<button class="bottom-btn" onclick="openStartingBalance()">⚙️ Saldo Inicial</button>
<button class="bottom-btn" onclick="removeCurrentMonth()">🗑️ Remover Mês</button>
</div>

<div class="pdf-buttons">
<button class="pdf-btn" onclick="generatePDF('month')">📄 PDF do Mês</button>
<button class="pdf-btn" onclick="generatePDF('year')">📄 PDF do Ano</button>
</div>

<div class="modal-overlay" id="modalOverlay">
<div class="modal" id="modalContent"></div>
</div>

<script>
var MONTHS=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
var CATEGORIES=['🏠 Moradia','🍔 Alimentação','🚗 Transporte','🎓 Educação','💊 Saúde','💳 Dívidas','🎮 Lazer','👔 Pessoal','📈 Investimento','🛡️ Reserva','❓ Outros'];
var CAT_PERCENTS={'🏠 Moradia':30,'🍔 Alimentação':15,'🚗 Transporte':10,'🎓 Educação':5,'💊 Saúde':5,'💳 Dívidas':0,'🎮 Lazer':10,'👔 Pessoal':5,'📈 Investimento':10,'🛡️ Reserva':10,'❓ Outros':0};
var EVENTS={'2026-05':'🎯 PLR','2026-08':'💰 13º','2026-10':'📍 HOJE','2026-11':'🏖️ Férias','2026-12':'🎄 13º+Balão','2027-01':'🏆 Plan.fim','2027-05':'🎯 PLR+Balão','2027-06':'🏆 Carro fim','2027-07':'🏆 MP zera'};
var currentMonth, currentYear, data;

function init(){
data=loadData();
var d=new Date();
currentMonth=d.getMonth();
currentYear=d.getFullYear();
if(!data.years)data.years=[2026,2027,2028];
if(!data.startingBalance)data.startingBalance={account:0,emergency:0,investments:0};
if(!data.months)data.months={};
ensureMonthData(currentYear,currentMonth);
render();
}

function loadData(){
try{var d=localStorage.getItem('finconsult_v4');return d?JSON.parse(d):getDefaultData();}
catch(e){return getDefaultData();}
}

function saveData(){localStorage.setItem('finconsult_v4',JSON.stringify(data));}

function getDefaultData(){
var d={years:[2026,2027,2028],startingBalance:{account:0,emergency:0,investments:0},months:{},removedMonths:{}};
var recRevBase=[
{name:'Adiantamento',value:6044.60,day:15,recurring:true,category:''},
{name:'Salário',value:2213,day:30,recurring:true,category:''},
{name:'Empreendimento',value:2500,day:25,recurring:true,category:''},
{name:'Empreend. Semanal',value:600,day:1,recurring:true,category:''}
];
var recExpBase=[
{name:'Financiamento Apto',value:3600,day:15,category:'🏠 Moradia',recurring:true},
{name:'Condomínio',value:1000,day:10,category:'🏠 Moradia',recurring:true},
{name:'Energia',value:300,day:8,category:'🏠 Moradia',recurring:true},
{name:'Água',value:190,day:5,category:'🏠 Moradia',recurring:true},
{name:'Internet',value:150,day:10,category:'🏠 Moradia',recurring:true},
{name:'Terapia',value:800,day:20,category:'💊 Saúde',recurring:true},
{name:'Faculdade Julia',value:700,day:8,category:'🎓 Educação',recurring:true},
{name:'Perua Escolar',value:280,day:5,category:'🎓 Educação',recurring:true},
{name:'Cartão Mercado',value:790,day:2,category:'🍔 Alimentação',recurring:true},
{name:'Combustível',value:500,day:20,category:'🚗 Transporte',recurring:true}
];
// Pre-load 2026 months
for(var m=0;m<12;m++){
var key='2026-'+pad(m);
var revs=JSON.parse(JSON.stringify(recRevBase));
var exps=JSON.parse(JSON.stringify(recExpBase));
// Adjust for specific months
if(m<9){// Jan-Sep: pre-loan salary
revs[1].value=3800;
}
// Add Santander
var santVal=4733;
exps.push({name:'Cartão Santander',value:santVal,day:27,category:'💳 Dívidas',recurring:true});
// Add Mercado Pago (starts later)
if(m>=8){exps.push({name:'Mercado Pago',value:336,day:16,category:'💳 Dívidas',recurring:true,installment:true,currentInst:(m-8+1),totalInst:10});}
// Add Planejados (ends Jan 2027)
if(m<=11){
var planVal=800;
if(m==11)planVal=2900;
exps.push({name:'Planejados',value:planVal,day:12,category:'🏠 Moradia',recurring:false});
}
// Carro (Jul-Jun on Santander)
if(m>=6){exps.push({name:'Parcela Carro',value:1535.25,day:27,category:'🚗 Transporte',recurring:false,installment:true,currentInst:(m-6+1),totalInst:12});}
// Special incomes
if(m==4){revs.push({name:'PLR',value:25000,day:5,recurring:false,category:''});}
if(m==7){revs.push({name:'13º (1ª parcela)',value:6977,day:20,recurring:false,category:''});}
if(m==10){revs.push({name:'13º (2ª parcela)',value:6978,day:20,recurring:false,category:''});}
// Dec specials
if(m==11){
exps.push({name:'Balão Carro',value:7000,day:15,category:'🚗 Transporte',recurring:false});
revs.push({name:'13º Salário',value:13955,day:1,recurring:false,category:''});
}
// Oct specifics
if(m==9){
revs.push({name:'Férias',value:7500,day:29,recurring:false,category:''});
exps.push({name:'Pneus + Alinhamento',value:1600,day:30,category:'🚗 Transporte',recurring:false});
// Override Cartão Mercado for Oct
for(var i=0;i<exps.length;i++){if(exps[i].name=='Cartão Mercado'){exps[i].value=1700;break;}}
}
// Nov specifics
if(m==10){
revs.push({name:'Férias',value:7500,day:1,recurring:false,category:''});
}
// Mark past months as all paid
var allPaid=(m<9);
var rList=[];for(var i=0;i<revs.length;i++){rList.push({id:Date.now()+Math.random()*10000+i,name:revs[i].name,value:revs[i].value,day:revs[i].day,recurring:revs[i].recurring||false,category:revs[i].category||'',paid:allPaid});}
var eList=[];for(var i=0;i<exps.length;i++){var e=exps[i];eList.push({id:Date.now()+Math.random()*10000+1000+i,name:e.name,value:e.value,day:e.day,category:e.category||'❓ Outros',recurring:e.recurring||false,paid:allPaid,installment:e.installment||false,currentInst:e.currentInst||0,totalInst:e.totalInst||0});}
d.months[key]={revenues:rList,expenses:eList};
}
// Pre-load 2027
for(var m=0;m<12;m++){
var key='2027-'+pad(m);
var revs=JSON.parse(JSON.stringify(recRevBase));
var exps=JSON.parse(JSON.stringify(recExpBase));
exps.push({name:'Cartão Santander',value:4733,day:27,category:'💳 Dívidas',recurring:true});
// Mercado Pago until Jul
if(m<7){exps.push({name:'Mercado Pago',value:336,day:16,category:'💳 Dívidas',recurring:false,installment:true,currentInst:(m+3),totalInst:10});}
// Carro until Jun
if(m<6){exps.push({name:'Parcela Carro',value:1535.25,day:27,category:'🚗 Transporte',recurring:false,installment:true,currentInst:(m+7),totalInst:12});}
// May balloon + PLR
if(m==4){
exps.push({name:'Balão Carro',value:10000,day:15,category:'🚗 Transporte',recurring:false});
revs.push({name:'PLR',value:25000,day:5,recurring:false,category:''});
}
// 13th salary
if(m==7){revs.push({name:'13º (1ª parcela)',value:6977,day:20,recurring:false,category:''});}
if(m==10){revs.push({name:'13º (2ª parcela)',value:6978,day:20,recurring:false,category:''});}
var rList=[];for(var i=0;i<revs.length;i++){rList.push({id:Date.now()+Math.random()*10000+2000+m*100+i,name:revs[i].name,value:revs[i].value,day:revs[i].day,recurring:revs[i].recurring||false,category:revs[i].category||'',paid:false});}
var eList=[];for(var i=0;i<exps.length;i++){var e=exps[i];eList.push({id:Date.now()+Math.random()*10000+3000+m*100+i,name:e.name,value:e.value,day:e.day,category:e.category||'❓ Outros',recurring:e.recurring||false,paid:false,installment:e.installment||false,currentInst:e.currentInst||0,totalInst:e.totalInst||0});}
d.months[key]={revenues:rList,expenses:eList};
}
// 2028 - just recurring
for(var m=0;m<12;m++){
var key='2028-'+pad(m);
var revs=JSON.parse(JSON.stringify(recRevBase));
var exps=JSON.parse(JSON.stringify(recExpBase));
var rList=[];for(var i=0;i<revs.length;i++){rList.push({id:Date.now()+Math.random()*10000+4000+m*100+i,name:revs[i].name,value:revs[i].value,day:revs[i].day,recurring:revs[i].recurring||false,category:revs[i].category||'',paid:false});}
var eList=[];for(var i=0;i<exps.length;i++){var e=exps[i];eList.push({id:Date.now()+Math.random()*10000+5000+m*100+i,name:e.name,value:e.value,day:e.day,category:e.category||'❓ Outros',recurring:e.recurring||false,paid:false,installment:false,currentInst:0,totalInst:0});}
d.months[key]={revenues:rList,expenses:eList};
}
return d;
}

function pad(n){return n<10?'0'+n:''+n;}

function getMonthKey(y,m){return y+'-'+pad(m);}

function ensureMonthData(y,m){
var key=getMonthKey(y,m);
if(!data.months[key]){
data.months[key]={revenues:[],expenses:[]};
// Propagate recurring from previous month
var prevM=m-1,prevY=y;
if(prevM<0){prevM=11;prevY--;}
var prevKey=getMonthKey(prevY,prevM);
if(data.months[prevKey]){
var pr=data.months[prevKey].revenues;
for(var i=0;i<pr.length;i++){
if(pr[i].recurring){
data.months[key].revenues.push({id:Date.now()+Math.random()*10000,name:pr[i].name,value:pr[i].value,day:pr[i].day,recurring:true,category:pr[i].category||'',paid:false});
}
}
var pe=data.months[prevKey].expenses;
for(var i=0;i<pe.length;i++){
if(pe[i].recurring){
data.months[key].expenses.push({id:Date.now()+Math.random()*10000,name:pe[i].name,value:pe[i].value,day:pe[i].day,category:pe[i].category,recurring:true,paid:false,installment:false,currentInst:0,totalInst:0});
}
if(pe[i].installment && pe[i].currentInst<pe[i].totalInst){
data.months[key].expenses.push({id:Date.now()+Math.random()*10000,name:pe[i].name,value:pe[i].value,day:pe[i].day,category:pe[i].category,recurring:false,paid:false,installment:true,currentInst:pe[i].currentInst+1,totalInst:pe[i].totalInst});
}
}
}
saveData();
}
}

function changeMonth(dir){
currentMonth+=dir;
if(currentMonth>11){currentMonth=0;currentYear++;}
if(currentMonth<0){currentMonth=11;currentYear--;}
ensureMonthData(currentYear,currentMonth);
render();
}

function changeYear(y){
currentYear=y;
currentMonth=0;
ensureMonthData(currentYear,currentMonth);
render();
}

function render(){
renderYearNav();
renderChart();
renderSummary();
renderCategories();
renderRevenues();
renderExpenses();
}

function renderYearNav(){
var html='';
for(var i=0;i<data.years.length;i++){
var y=data.years[i];
var cls=y==currentYear?'active':'';
html+='<button class="'+cls+'" onclick="changeYear('+y+')">'+y+'</button>';
}
html+='<button class="add-year" onclick="addYear()">+</button>';
html+='<button class="del-year" onclick="deleteYear()">🗑️</button>';
document.getElementById('yearNav').innerHTML=html;
}

function addYear(){
var maxY=Math.max.apply(null,data.years);
var newY=maxY+1;
data.years.push(newY);
for(var m=0;m<12;m++){ensureMonthData(newY,m);}
saveData();
changeYear(newY);
}

function deleteYear(){
if(data.years.length<=1){alert('Precisa ter pelo menos 1 ano!');return;}
var y=prompt('Qual ano deseja excluir?\nAnos: '+data.years.join(', '));
if(!y)return;
y=parseInt(y);
var idx=data.years.indexOf(y);
if(idx===-1){alert('Ano não encontrado!');return;}
if(!confirm('Excluir '+y+' e todos os seus dados?'))return;
data.years.splice(idx,1);
for(var m=0;m<12;m++){delete data.months[getMonthKey(y,m)];}
if(currentYear==y){currentYear=data.years[0];currentMonth=0;}
saveData();
render();
}

function renderChart(){
document.getElementById('chartTitle').textContent='📈 Projeção '+currentYear;
var html='';
var maxVal=1;
var totals=[];
var now=new Date();
var nowY=now.getFullYear();
var nowM=now.getMonth();
var greenCount=0,redCount=0,yearTotal=0;
for(var m=0;m<12;m++){
var key=getMonthKey(currentYear,m);
if(data.removedMonths && data.removedMonths[key]){totals.push(null);continue;}
var md=data.months[key];
var rev=0,exp=0;
if(md){
for(var i=0;i<md.revenues.length;i++)rev+=md.revenues[i].value;
for(var i=0;i<md.expenses.length;i++)exp+=md.expenses[i].value;
}
var bal=rev-exp;
totals.push(bal);
if(Math.abs(bal)>maxVal)maxVal=Math.abs(bal);
}
for(var m=0;m<12;m++){
if(totals[m]===null)continue;
var bal=totals[m];
var pct=Math.min(Math.abs(bal)/maxVal*100,100);
var isPositive=bal>=0;
var isPast=(currentYear<nowY)||(currentYear==nowY&&m<nowM);
var isCurrent=(currentYear==nowY&&m==nowM);
var isFuture=(currentYear>nowY)||(currentYear==nowY&&m>nowM);
var barClass=isPositive?'positive':'negative';
if(isFuture)barClass+=' future';
if(isCurrent)barClass+=' current';
var evKey=currentYear+'-'+pad(m);
var event=EVENTS[evKey]||'';
var valStr=isPositive?'+R$'+formatNum(bal):'-R$'+formatNum(Math.abs(bal));
var valClass=isPositive?'green':'red';
if(isPositive)greenCount++;else redCount++;
yearTotal+=bal;
html+='<div class="chart-row">';
html+='<div class="chart-month">'+MONTHS[m].substr(0,3)+'</div>';
html+='<div class="chart-icon">'+(isPast?'✅':(isCurrent?'📍':'🔮'))+'</div>';
html+='<div class="chart-bar-container"><div class="chart-bar '+barClass+'" style="width:'+Math.max(pct,3)+'%"></div></div>';
html+='<div class="chart-value '+valClass+'">'+valStr+'</div>';
if(event)html+='<div class="chart-event">'+event+'</div>';
html+='</div>';
}
document.getElementById('chartContainer').innerHTML=html;
var ytClass=yearTotal>=0?'green':'red';
var ytStr=yearTotal>=0?'+R$ '+formatNum(yearTotal):'-R$ '+formatNum(Math.abs(yearTotal));
document.getElementById('chartSummary').innerHTML='<span>🟢 '+greenCount+'</span><span>🔴 '+redCount+'</span><span class="'+ytClass+'">Resultado: '+ytStr+'</span>';
}

function saveItem(type,editId){
var name=document.getElementById('modalName').value.trim();
var value=parseFloat(document.getElementById('modalValue').value);
var day=parseInt(document.getElementById('modalDay').value);
if(!name||isNaN(value)||isNaN(day)){alert('Preencha todos os campos!');return;}
var recurring=document.getElementById('toggleRec').classList.contains('active');
var key=getMonthKey(currentYear,currentMonth);
var md=data.months[key];
if(type=='revenue'){
if(editId){
for(var i=0;i<md.revenues.length;i++){
if(md.revenues[i].id==editId){
md.revenues[i].name=name;md.revenues[i].value=value;md.revenues[i].day=day;md.revenues[i].recurring=recurring;break;
}
}
}else{
md.revenues.push({id:Date.now()+Math.random()*10000,name:name,value:value,day:day,recurring:recurring,category:'',paid:false});
}
if(recurring)propagateRecurring(type,name,value,day,'',recurring);
}else{
var cat=document.getElementById('modalCat').value;
var isInst=document.getElementById('toggleInst')&&document.getElementById('toggleInst').classList.contains('active');
var curInst=1,totInst=1;
if(isInst){
curInst=parseInt(document.getElementById('modalCurInst').value)||1;
totInst=parseInt(document.getElementById('modalTotInst').value)||1;
}
if(editId){
for(var i=0;i<md.expenses.length;i++){
if(md.expenses[i].id==editId){
md.expenses[i].name=name;md.expenses[i].value=value;md.expenses[i].day=day;md.expenses[i].category=cat;md.expenses[i].recurring=recurring;md.expenses[i].installment=isInst;md.expenses[i].currentInst=curInst;md.expenses[i].totalInst=totInst;break;
}
}
}else{
md.expenses.push({id:Date.now()+Math.random()*10000,name:name,value:value,day:day,category:cat,recurring:recurring,paid:false,installment:isInst,currentInst:curInst,totalInst:totInst});
}
if(recurring)propagateRecurring(type,name,value,day,cat,recurring);
if(isInst)propagateInstallments(name,value,day,cat,curInst,totInst);
}
saveData();closeModal();render();
}

function propagateRecurring(type,name,value,day,cat,recurring){
for(var y=0;y<data.years.length;y++){
for(var m=0;m<12;m++){
var mk=getMonthKey(data.years[y],m);
if(mk<=getMonthKey(currentYear,currentMonth))continue;
if(!data.months[mk])continue;
var list=type=='revenue'?data.months[mk].revenues:data.months[mk].expenses;
var found=false;
for(var i=0;i<list.length;i++){if(list[i].name==name&&list[i].recurring){found=true;list[i].value=value;list[i].day=day;if(cat)list[i].category=cat;break;}}
if(!found){
var newItem={id:Date.now()+Math.random()*100000,name:name,value:value,day:day,recurring:true,paid:false};
if(type=='expense'){newItem.category=cat;newItem.installment=false;newItem.currentInst=0;newItem.totalInst=0;}
else{newItem.category='';}
list.push(newItem);
}
}
}
}

function propagateInstallments(name,value,day,cat,curInst,totInst){
var startM=currentMonth;var startY=currentYear;
for(var inst=curInst+1;inst<=totInst;inst++){
startM++;
if(startM>11){startM=0;startY++;}
var mk=getMonthKey(startY,startM);
if(!data.months[mk]){ensureMonthData(startY,startM);}
var list=data.months[mk].expenses;
var found=false;
for(var i=0;i<list.length;i++){if(list[i].name==name&&list[i].installment){found=true;list[i].currentInst=inst;list[i].value=value;break;}}
if(!found){
list.push({id:Date.now()+Math.random()*100000,name:name,value:value,day:day,category:cat,recurring:false,paid:false,installment:true,currentInst:inst,totalInst:totInst});
}
}
}

html+='<h2>📋 Contas</h2><table><tr><th>Nome</th><th>Dia</th><th>Categoria</th><th class="right">Valor</th><th class="center">Status</th></tr>';
var sorted=md.expenses.slice().sort(function(a,b){return a.day-b.day;});
for(var i=0;i<sorted.length;i++){var e=sorted[i];var inst=e.installment?' '+e.currentInst+'/'+e.totalInst:'';html+='<tr><td>'+e.name+inst+'</td><td>'+e.day+'</td><td>'+e.category+'</td><td class="right red">R$ '+formatNum(e.value)+'</td><td class="center">'+(e.paid?'✅':'⬜')+'</td></tr>';}
html+='</table>';
// Categories
var catTotals={};
for(var i=0;i<md.expenses.length;i++){var c=md.expenses[i].category;if(!catTotals[c])catTotals[c]=0;catTotals[c]+=md.expenses[i].value;}
html+='<h2>📊 Por Categoria</h2><table><tr><th>Categoria</th><th class="right">Real</th><th class="right">Sugerido</th><th class="center">Status</th></tr>';
for(var i=0;i<CATEGORIES.length;i++){var cat=CATEGORIES[i];var real=catTotals[cat]||0;var pct=CAT_PERCENTS[cat];var sug=Math.round(totalRev*pct/100);if(pct==0&&real==0)continue;var st=pct>0?(real<=sug?'🟢':'🔴'):'';html+='<tr><td>'+cat+'</td><td class="right">R$ '+formatNum(real)+'</td><td class="right">'+(pct>0?'R$ '+formatNum(sug):'-')+'</td><td class="center">'+st+'</td></tr>';}
html+='</table>';
}else{
html+='<h1>💰 FinConsult — '+currentYear+'</h1>';
var sb=data.startingBalance;
if(sb&&(sb.account+sb.emergency+sb.investments)>0){
html+='<div class="box">Ponto de Partida<br>💰 Conta: R$ '+formatNum(sb.account)+' | 🛡️ Reserva: R$ '+formatNum(sb.emergency)+' | 📈 Invest.: R$ '+formatNum(sb.investments)+'</div>';
}
html+='<h2>📈 Projeção Anual</h2><table><tr><th>Mês</th><th class="right">Receita</th><th class="right">Despesa</th><th class="right">Resultado</th></tr>';
var yearTotal=0;
for(var m=0;m<12;m++){
var mk=getMonthKey(currentYear,m);
if(data.removedMonths&&data.removedMonths[mk])continue;
var md=data.months[mk];var rev=0,exp=0;
if(md){for(var i=0;i<md.revenues.length;i++)rev+=md.revenues[i].value;for(var i=0;i<md.expenses.length;i++)exp+=md.expenses[i].value;}
var bal=rev-exp;yearTotal+=bal;
var cls=bal>=0?'green':'red';
html+='<tr><td>'+MONTHS[m].substr(0,3)+'</td><td class="right">R$ '+formatNum(rev)+'</td><td class="right">R$ '+formatNum(exp)+'</td><td class="right '+cls+'">R$ '+formatNum(Math.abs(bal))+(bal<0?' ⚠️':'')+'</td></tr>';
}
html+='</table>';
html+='<div class="box big '+(yearTotal>=0?'green':'red')+'">Resultado do Ano: R$ '+formatNum(Math.abs(yearTotal))+(yearTotal>=0?' ✅':' ⚠️')+'</div>';
}
html+='<div style="text-align:center;margin-top:20px;font-size:11px;color:#999">Gerado em '+new Date().toLocaleString('pt-BR')+' — FinConsult</div>';
html+='</body></html>';
w.document.write(html);w.document.close();
setTimeout(function(){w.print();},500);
}

function formatNum(n){return n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,'.');}

document.getElementById('modalOverlay').addEventListener('click',function(e){if(e.target===this)closeModal();});

init();
</script>
</body>
</html>
